[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robohome"
version = "0.1.0"
description = "家庭专属机器人管家：把家封装成规范数据，让机器人按函数调用的方式做家务"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=2.3"]
dev = ["pytest>=8"]

[project.scripts]
robohome = "robohome.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
